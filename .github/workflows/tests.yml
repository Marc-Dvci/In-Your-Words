# On every push: lint, format and types; the shared core, the evaluation and the web app's unit tests in random order
# with coverage; the web build and its browser tests with accessibility checks; the Android unit tests against the
# same vectors; spelling and links. Read-only: nothing here writes to the repository.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - name: Types
        run: npx tsc -p core && npx tsc -p web --noEmit
      - name: Unit tests in random order, with line and branch coverage of the core
        run: npx vitest run --coverage --sequence.shuffle --reporter=default --reporter=json --outputFile=vitest.json
      - run: npm run build -w web
      - run: npx playwright install --with-deps chromium
      - name: Browser tests on the built app, with WCAG 2.2 AA checks
        run: npx playwright test
      - name: Summary on the run page
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("vitest.json", "utf8"));
            const c = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
            const out = ["### Tests", "", `${v.numPassedTests} passed, ${v.numFailedTests} failed, ${v.numPendingTests} skipped (unit, in random order)`, "", "### Coverage of the core", "", "| File | Lines | Branches |", "|---|---|---|"];
            for (const [f, s] of Object.entries(c)) out.push(`| ${f === "total" ? "**total**" : f.replace(/.*core\/src\//, "")} | ${s.lines.pct} % | ${s.branches.pct} % |`);
            for (const split of ["dev", "heldout"]) { const p = `eval/results-${split}.md`; if (fs.existsSync(p)) out.push("", `### Evaluation, ${split} set`, "", fs.readFileSync(p, "utf8")); }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config for the build (the unit tests make no network call)
        run: |
          cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"1","project_id":"ci","storage_bucket":"ci.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"app.inyourwords"}},
           "api_key":[{"current_key":"ci"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
      - name: Kotlin core against the shared vectors
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: The app builds
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install codespell==2.4.1
      - run: codespell --skip "*.json,*.jsonl,package-lock.json,*.svg,*.png,*.pdf" --ignore-words-list "te,ue,crate,fo"
      - run: python scripts/check_links.py
      - run: python scripts/check_placeholders.py
