# A smoke test of the live demo during judging, with its own badge; it also keeps the demo warm.
# It reads the live site and writes nothing to the repository.
# After RESULTS_DATE the job ends at once, so stopping the demo later never turns the badge red.
name: live
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: read
env:
  LIVE_URL: "https://in-your-words-2026.web.app"
  RESULTS_DATE: "2027-02-28" # YYYY-MM-DD
jobs:
  smoke:
    if: github.repository == 'Marc-Dvci/In-Your-Words'
    runs-on: ubuntu-latest
    steps:
      - name: The live demo answers
        run: |
          if [ -z "$LIVE_URL" ]; then echo "No LIVE_URL set."; exit 0; fi
          if [ -n "$RESULTS_DATE" ] && [ "$(date -u +%F)" \> "$RESULTS_DATE" ]; then echo "Past the results date."; exit 0; fi
          page=$(curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$LIVE_URL/")
          echo "$page" | grep -q '<title>In Your Words</title>'
          asset=$(echo "$page" | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -fsS --max-time 90 "$LIVE_URL$asset" -o /dev/null
